[project]
name = "personal-planner-backend"
version = "0.1.0"
description = "FastAPI backend for a personal planner."
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.116",
    "google-genai>=2.18.0",
    "httpx>=0.28",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.10",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=8.4",
    "pytest-cov>=7.1.0",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "D",
    "UP",
    "N",
    "ANN",
    "B",
    "C4",
    "DTZ",
    "T20",
    "PT",
    "RET",
    "S",
    "SIM",
    "ARG",
    "ERA",
    "PL",
    "D1",
    "D2",
    "D4",
    "C901",
    "PLR0915",
]
ignore = [
    "D203",
    "D212",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]
"test_*.py" = ["D100", "D101", "D102", "D103", "ANN", "S101", "S105", "S106"]
"conftest.py" = ["S105", "S106"]
"alembic/**" = ["S608"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
mypy-init-return = true
suppress-none-returning = true
